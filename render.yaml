services:
  - type: web
    name: glassbox-scheduler
    env: python
    plan: free
    rootDir: sih/block_planner
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
